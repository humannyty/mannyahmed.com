<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Paper grain tile (same noise as the old #grainf filter), rendered to src/assets/grain.png
     by scripts/render-art.mjs and repeated over the scenes in CSS. -->
  <filter id="grainf" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0.22 0"/>
  </filter>
  <rect width="256" height="256" filter="url(#grainf)"/>
</svg>
